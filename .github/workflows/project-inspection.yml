
name: Project Hosting Data Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve and inspect project hosting data
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          DATA_SOURCE_ID: ${{ vars.NOTION_PROJECTS_DATA_SOURCE_ID }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body \
            -X POST \
            "https://api.notion.com/v1/data_sources/${DATA_SOURCE_ID}/query" \
            -H "Authorization: Bearer ${NOTION_API_KEY}" \
            -H "Notion-Version: 2025-09-03" \
            -H "Content-Type: application/json" \
            -d '{"page_size": 100}' \
            -o projects.json

          echo "Projects retrieved successfully."

          echo "PROJECT | EXPIRY DATE | EXTENSION | STATUS | RENDER SERVICE ID"

          jq -r '
            def plain_text:
              map(.plain_text // "") | join("");

            .results[] |
            [
              ((.properties["Project Name"].title // []) | plain_text),
              (.properties["Hosting Expiry Date"].date.start // "Not set"),
              (.properties["Hosting Extension"].select.name // "Not set"),
              (.properties["Hosting Status"].select.name // "Not set"),
              ((.properties["Render Service ID"].rich_text // []) | plain_text)
            ] | @tsv
          ' projects.json

          echo ""
          echo "Records retrieved: $(jq '.results | length' projects.json)"
          echo "Has more pages: $(jq '.has_more' projects.json)"
