
name: Hosting Lifecycle Manager

on:
  workflow_dispatch:
  schedule:
    # 12:15 AM IST every day
    - cron: "45 18 * * *"

permissions:
  contents: read

jobs:
  hosting-check:
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate hosting lifecycle
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DATA_SOURCE_ID: ${{ vars.NOTION_PROJECTS_DATA_SOURCE_ID }}
          TZ: Asia/Kolkata

        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import date
          from zoneinfo import ZoneInfo

          NOTION_KEY = os.environ["NOTION_API_KEY"]
          RENDER_KEY = os.environ["RENDER_API_KEY"]
          DATA_SOURCE_ID = os.environ["DATA_SOURCE_ID"]

          NOTION_VERSION = "2025-09-03"
          TODAY = date.today()
          DRY_RUN = True

          IST = ZoneInfo("Asia/Kolkata")

          def api_request(url, token, version=None, method="GET", body=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json"
              }

              if version:
                  headers["Notion-Version"] = version

              if body is not None:
                  headers["Content-Type"] = "application/json"

              data = (
                  json.dumps(body).encode("utf-8")
                  if body is not None else None
              )

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read()
                      return json.loads(content) if content else {}
              except urllib.error.HTTPError as error:
                  print(f"API request failed: HTTP {error.code}")
                  raise

          def get_notion_projects():
              projects = []
              cursor = None

              while True:
                  body = {"page_size": 100}

                  if cursor:
                      body["start_cursor"] = cursor

                  response = api_request(
                      f"https://api.notion.com/v1/data_sources/{DATA_SOURCE_ID}/query",
                      NOTION_KEY,
                      version=NOTION_VERSION,
                      method="POST",
                      body=body
                  )

                  projects.extend(response.get("results", []))

                  if not response.get("has_more"):
                      break

                  cursor = response.get("next_cursor")

                  if not cursor:
                      raise RuntimeError("Missing Notion pagination cursor.")

              return projects

          def get_render_service(service_id):
              return api_request(
                  f"https://api.render.com/v1/services/{service_id}",
                  RENDER_KEY
              )

          def get_text(items):
              return "".join(
                  item.get("plain_text", "")
                  for item in (items or [])
              ).strip()

          def get_project_data(project):
              properties = project.get("properties", {})

              name = get_text(
                  properties.get("Project Name", {}).get("title", [])
              ) or "Unnamed project"

              expiry_data = (
                  properties.get("Hosting Expiry Date", {}).get("date") or {}
              )

              expiry = expiry_data.get("start")

              extension_data = (
                  properties.get("Hosting Extension", {}).get("select") or {}
              )

              extension = extension_data.get("name")

              status_data = (
                  properties.get("Hosting Status", {}).get("select") or {}
              )

              status = status_data.get("name")

              service_id = get_text(
                  properties.get("Render Service ID", {}).get("rich_text", [])
              )

              return {
                  "page_id": project["id"],
                  "name": name,
                  "expiry": expiry,
                  "extension": extension,
                  "status": status,
                  "service_id": service_id
              }

          def evaluate(project, service):
              status = project["status"]
              extension = project["extension"]
              expiry = project["expiry"]

              if status == "Not Applicable":
                  return "IGNORE"

              if extension == "Lifetime":
                  if service["suspended"] == "suspended":
                      return "MANUAL REVIEW - LIFETIME SITE SUSPENDED"
                  return "KEEP RUNNING - LIFETIME"

              if not project["service_id"]:
                  return "SKIP - MISSING SERVICE ID"

              if not expiry:
                  return "SKIP - MISSING EXPIRY DATE"

              if status not in ("Active", "Expired"):
                  return "SKIP - UNKNOWN HOSTING STATUS"

              expiry_date = date.fromisoformat(expiry)
              suspended = service["suspended"]

              if service["type"] != "static_site":
                  return "SKIP - NOT A STATIC SITE"

              if status == "Active" and expiry_date < TODAY:
                  if suspended == "suspended":
                      return "ALREADY SUSPENDED - MARK EXPIRED"
                  return "WOULD SUSPEND AND MARK EXPIRED"

              if expiry_date >= TODAY:
                  if status == "Expired":
                      if extension not in (
                          "7 Days", "15 Days", "30 Days",
                          "60 Days", "90 Days"
                      ):
                          return "SKIP - VERIFY EXTENSION VALUE"

                      if suspended == "suspended":
                          return "WOULD RESUME AND MARK ACTIVE"

                      return "WOULD MARK ACTIVE - ALREADY RUNNING"

                  return "KEEP RUNNING"

              if status == "Expired":
                  return "KEEP SUSPENDED"

              return "SKIP - UNHANDLED CONDITION"

          print("=" * 65)
          print("LOVE IN PIXELS 4U - HOSTING LIFECYCLE MANAGER")
          print("=" * 65)

          print(f"Evaluation date (IST): {TODAY}")
          print(f"Dry-run mode: {DRY_RUN}")
          print("No live actions are permitted in this version.")
          print("")

          projects = get_notion_projects()

          print(f"Notion projects retrieved: {len(projects)}")
          print("")

          service_cache = {}

          for record in projects:
              project = get_project_data(record)

              print("-" * 65)
              print(f"PROJECT: {project['name']}")
              print(f"EXPIRY: {project['expiry'] or 'Not set'}")
              print(f"EXTENSION: {project['extension'] or 'Not set'}")
              print(f"STATUS: {project['status'] or 'Not set'}")

              if project["status"] == "Not Applicable":
                print("DECISION: IGNORE - NOT APPLICABLE")
                continue

              if project["extension"] == "Lifetime":
                print("DECISION: KEEP RUNNING - LIFETIME")
                print("No Render API lookup required.")
                continue

              service_id = project["service_id"]

              if not service_id:
                  print("DECISION: SKIP - MISSING SERVICE ID")
                  continue

              try:
                  if service_id not in service_cache:
                      service_cache[service_id] = get_render_service(
                          service_id
                      )

                  service = service_cache[service_id]

              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print("DECISION: SKIP - SERVICE NOT FOUND")
                      continue
                  raise

              decision = evaluate(project, service)

              print(f"RENDER SERVICE: {service.get('name', 'Unknown')}")
              print(f"SERVICE TYPE: {service.get('type', 'Unknown')}")
              print(f"RENDER STATE: {service.get('suspended', 'Unknown')}")
              print(f"DECISION: {decision}")

          print("")
          print("=" * 65)
          print("HOSTING EVALUATION COMPLETED")
          print("No Render or Notion records were modified.")
          print("=" * 65)

          PY
