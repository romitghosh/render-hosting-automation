
name: Hosting Lifecycle Manager

on:
  workflow_dispatch:
  schedule:
    - cron: "45 18 * * *"

permissions:
  contents: read

concurrency:
  group: hosting-lifecycle
  cancel-in-progress: false

jobs:
  hosting-check:
    runs-on: ubuntu-latest

    steps:
      - name: Execute hosting lifecycle
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DATA_SOURCE_ID: ${{ vars.NOTION_PROJECTS_DATA_SOURCE_ID }}
          ENABLE_LIVE_ACTIONS: ${{ vars.ENABLE_LIVE_ACTIONS }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime
          from zoneinfo import ZoneInfo

          NOTION_KEY = os.environ["NOTION_API_KEY"]
          RENDER_KEY = os.environ["RENDER_API_KEY"]
          DATA_SOURCE_ID = os.environ["DATA_SOURCE_ID"]

          LIVE = os.environ.get(
              "ENABLE_LIVE_ACTIONS", "false"
          ).lower() == "true"

          NOTION_VERSION = "2025-09-03"
          TODAY = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).date()

          PAID_EXTENSIONS = {
              "7 Days", "15 Days", "30 Days",
              "60 Days", "90 Days"
          }

          def api_request(url, token, version=None,
                          method="GET", body=None):

              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json"
              }

              if version:
                  headers["Notion-Version"] = version

              if body is not None:
                  headers["Content-Type"] = "application/json"

              data = (
                  json.dumps(body).encode()
                  if body is not None else None
              )

              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      content = response.read()
                      return response.status, (
                          json.loads(content) if content else {}
                      )
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors="replace")
                  raise RuntimeError(
                      f"API request failed: HTTP {error.code}: {detail[:500]}"
                  )

          def notion_request(url, method="GET", body=None):
              return api_request(
                  url, NOTION_KEY,
                  version=NOTION_VERSION,
                  method=method,
                  body=body
              )

          def render_request(url, method="GET"):
              return api_request(
                  url, RENDER_KEY, method=method
              )

          def get_projects():
              projects = []
              cursor = None

              while True:
                  body = {"page_size": 100}

                  if cursor:
                      body["start_cursor"] = cursor

                  _, response = notion_request(
                      f"https://api.notion.com/v1/data_sources/"
                      f"{DATA_SOURCE_ID}/query",
                      method="POST",
                      body=body
                  )

                  projects.extend(response.get("results", []))

                  if not response.get("has_more"):
                      break

                  cursor = response.get("next_cursor")

                  if not cursor:
                      raise RuntimeError("Missing pagination cursor.")

              return projects

          def get_text(items):
              return "".join(
                  item.get("plain_text", "")
                  for item in (items or [])
              ).strip()

          def read_project(record):
              p = record.get("properties", {})

              expiry = (
                  p.get("Hosting Expiry Date", {}).get("date") or {}
              ).get("start")

              extension = (
                  p.get("Hosting Extension", {}).get("select") or {}
              ).get("name")

              status = (
                  p.get("Hosting Status", {}).get("select") or {}
              ).get("name")

              return {
                  "page_id": record["id"],
                  "name": get_text(
                      p.get("Project Name", {}).get("title", [])
                  ) or "Unnamed project",
                  "expiry": expiry,
                  "extension": extension,
                  "status": status,
                  "service_id": get_text(
                      p.get("Render Service ID", {}).get("rich_text", [])
                  )
              }

          def update_notion_status(page_id, status):
              code, _ = notion_request(
                  f"https://api.notion.com/v1/pages/{page_id}",
                  method="PATCH",
                  body={
                      "properties": {
                          "Hosting Status": {
                              "select": {"name": status}
                          }
                      }
                  }
              )

              if code != 200:
                  raise RuntimeError(
                      f"Notion status update returned HTTP {code}"
                  )

          def get_service(service_id):
              _, service = render_request(
                  f"https://api.render.com/v1/services/{service_id}"
              )
              return service

          def change_render_state(service_id, action, expected_state):
              endpoint = (
                  f"https://api.render.com/v1/services/"
                  f"{service_id}/{action}"
              )

              code, _ = render_request(endpoint, method="POST")

              if code != 202:
                  raise RuntimeError(
                      f"Render {action} returned HTTP {code}"
                  )

              # Render accepts the operation asynchronously.
              # Verify the resulting state before changing Notion.
              for attempt in range(12):
                  time.sleep(5)
                  service = get_service(service_id)

                  if service.get("suspended") == expected_state:
                      return True

              return False

          projects = get_projects()

          print("=" * 65)
          print("LOVE IN PIXELS 4U - HOSTING LIFECYCLE MANAGER")
          print("=" * 65)
          print(f"Date (IST): {TODAY}")
          print(f"Live actions enabled: {LIVE}")
          print(f"Projects retrieved: {len(projects)}")
          print("")

          for record in projects:
              project = read_project(record)

              name = project["name"]
              status = project["status"]
              extension = project["extension"]
              expiry = project["expiry"]
              service_id = project["service_id"]

              print("-" * 65)
              print(f"PROJECT: {name}")

              if status == "Not Applicable":
                  print("ACTION: IGNORE - NOT APPLICABLE")
                  continue

              if extension == "Lifetime":
                  print("ACTION: KEEP RUNNING - LIFETIME")
                  continue

              if not service_id:
                  print("ACTION: SKIP - MISSING SERVICE ID")
                  continue

              if not expiry:
                  print("ACTION: SKIP - MISSING EXPIRY DATE")
                  continue

              if status not in ("Active", "Expired"):
                  print("ACTION: SKIP - INVALID HOSTING STATUS")
                  continue

              try:
                  service = get_service(service_id)
              except RuntimeError as error:
                  print(f"ACTION: SKIP - SERVICE LOOKUP FAILED")
                  print(str(error))
                  continue

              if service.get("type") != "static_site":
                  print("ACTION: SKIP - NOT A STATIC SITE")
                  continue

              if service.get("id") != service_id:
                  print("ACTION: SKIP - SERVICE ID MISMATCH")
                  continue

              expiry_date = datetime.fromisoformat(
                  expiry
              ).date()

              suspended = service.get("suspended")

              print(f"EXPIRY: {expiry_date}")
              print(f"EXTENSION: {extension}")
              print(f"STATUS: {status}")
              print(f"RENDER STATE: {suspended}")

              action = None
              new_status = None
              expected_state = None

              if status == "Active" and expiry_date < TODAY:
                  if suspended == "not_suspended":
                      action = "suspend"
                      new_status = "Expired"
                      expected_state = "suspended"
                  else:
                      print("ACTION: ALREADY SUSPENDED")
                      new_status = "Expired"

              elif status == "Expired" and expiry_date >= TODAY:
                  if extension not in PAID_EXTENSIONS:
                      print("ACTION: SKIP - VALID EXTENSION NOT RECORDED")
                      continue

                  if suspended == "suspended":
                      action = "resume"
                      new_status = "Active"
                      expected_state = "not_suspended"
                  elif suspended == "not_suspended":
                      print("ACTION: ALREADY RUNNING")
                      new_status = "Active"
                  else:
                      print("ACTION: SKIP - UNKNOWN RENDER STATE")
                      continue

              elif status == "Active" and expiry_date >= TODAY:
                  print("ACTION: KEEP RUNNING")
                  continue

              else:
                  print("ACTION: KEEP EXPIRED")
                  continue

              if new_status and not action:
                  if status != new_status and LIVE:
                      update_notion_status(
                          project["page_id"], new_status
                      )
                      print(f"NOTION: STATUS UPDATED TO {new_status}")
                  else:
                      print(f"DECISION: STATUS SHOULD BE {new_status}")
                  continue

              if not action:
                  continue

              print(f"PROPOSED RENDER ACTION: {action.upper()}")

              if not LIVE:
                  print("DRY RUN: No changes made.")
                  continue

              try:
                  confirmed = change_render_state(
                      service_id, action, expected_state
                  )

                  if not confirmed:
                      print(
                          "ERROR: Render state not confirmed. "
                          "Notion status left unchanged."
                      )
                      continue

                  update_notion_status(
                      project["page_id"], new_status
                  )

                  print(f"SUCCESS: Render {action} confirmed.")
                  print(f"SUCCESS: Notion status set to {new_status}.")

              except RuntimeError as error:
                  print(f"ERROR: {error}")
                  print("Notion status was not changed.")

          print("")
          print("=" * 65)
          print("HOSTING LIFECYCLE EVALUATION COMPLETED")
          print(f"Live actions enabled: {LIVE}")
          print("=" * 65)
          PY
