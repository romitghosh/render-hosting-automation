
name: Project Hosting Data Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve and diagnose project properties
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          DATA_SOURCE_ID: ${{ vars.NOTION_PROJECTS_DATA_SOURCE_ID }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body \
            -X POST \
            "https://api.notion.com/v1/data_sources/${DATA_SOURCE_ID}/query" \
            -H "Authorization: Bearer ${NOTION_API_KEY}" \
            -H "Notion-Version: 2025-09-03" \
            -H "Content-Type: application/json" \
            -d '{"page_size": 5}' \
            -o projects.json

          echo "Projects retrieved successfully."

          echo "Response structure:"
          jq '{
            results_type: (.results | type),
            record_count: (.results | length),
            properties_type: (.results[0].properties | type),
            property_names: (
              if (.results[0].properties | type) == "object"
              then (.results[0].properties | keys)
              else []
              end
            )
          }' projects.json

          echo ""
          echo "Hosting property structures:"

          jq '
            .results[] |
            {
              hosting_expiry_type:
                (.properties["Hosting Expiry Date"] | type),
              hosting_extension_type:
                (.properties["Hosting Extension"] | type),
              hosting_status_type:
                (.properties["Hosting Status"] | type),
              render_service_id_type:
                (.properties["Render Service ID"] | type)
            }
          ' projects.json

          echo ""
          echo "Diagnostic completed."
