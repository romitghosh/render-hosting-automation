
name: Render API Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-render:
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve Render services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail

          if [ -z "$RENDER_API_KEY" ]; then
            echo "Missing RENDER_API_KEY GitHub secret."
            exit 1
          fi

          HTTP_STATUS=$(curl --silent --show-error \
            -o render-response.json \
            -w "%{http_code}" \
            "https://api.render.com/v1/services?limit=20" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json")

          echo "HTTP Status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Render API error:"
            jq '{message, error}' render-response.json
            exit 1
          fi

          echo "Render API connection successful."
          echo "Available services:"

          jq -r '
            .[] |
            .service |
            [
              .name,
              .type,
              .id,
              .suspended
            ] |
            @tsv
          ' render-response.json
